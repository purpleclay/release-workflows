name: release-rust
on:
  workflow_call:
    inputs:
      bin:
        description: Name of the binary to build and package
        type: string
        required: true
      targets:
        description: >-
          JSON array of Rust target triples, e.g.
          ["x86_64-unknown-linux-musl","aarch64-apple-darwin"]. Must be a
          subset of the supported allowlist (see the plan job).
        type: string
        required: true
      toolchain:
        description: Rust toolchain specifier (stable, 1.89.0, ...)
        type: string
        required: false
        default: stable
      environment:
        description: >-
          GitHub environment the publish job runs under (S11). Referencing a
          missing environment auto-creates it unprotected — add a required
          reviewer in each adopting repo to complete the control.
        type: string
        required: false
        default: release
      package-files:
        description: >-
          Space-separated list of extra files bundled into each release
          archive alongside the binary. Missing files are skipped.
        type: string
        required: false
        default: LICENSE README.md
    outputs:
      release-url:
        description: URL of the published release
        value: ${{ jobs.provenance.outputs.release-url }}

permissions: {}

env:
  # Trusted build-tool pins. Bumping these is a release-security change for
  # every consuming project; treat with the same review weight as code.
  # Zig's source moved to Codeberg (https://codeberg.org/ziglang/zig), but
  # release artifacts are still published via ziglang.org/download, so the
  # setup_zig mirror below is unaffected. GitHub's mirror of ziglang/zig is
  # stale (stuck at 0.15.x), so this pin is tracked by the repo-local
  # Codeberg-aware regex manager in .github/renovate.json rather than the
  # shared datasource=github-tags pattern used below for ZIGBUILD_VERSION.

  # renovate: depName=ziglang/zig
  ZIG_VERSION: "0.16.0"
  # renovate: datasource=github-tags depName=rust-cross/cargo-zigbuild versioning=semver
  ZIGBUILD_VERSION: "0.23.0"

jobs:
  # Validates requested targets against the explicit allowlist and emits the
  # build matrix. Fails fast on anything unsupported — a trust-root workflow
  # never guesses a runner or build strategy for an unknown target.
  plan:
    name: plan_build_matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # The reviewed mirror hosts below (all of .github/zig-mirrors.txt)
          # must be probed for liveness before one can be pinned into the
          # build matrix (see compose_build_matrix) — this list can't be
          # derived from that file at runtime, since harden_runner is the
          # very first step and runs before checkout_release_workflows.
          # Keep in sync by hand: adding a mirror to zig-mirrors.txt means
          # adding its host here too, or the probe can never reach it.
          allowed-endpoints: >
            github.com:443
            ziglang.org:443
            fs.liujiacai.net:443
            pkg.earth:443
            pkg.hexops.org:443
            zig-mirror.tsimnet.eu:443
            zig.bcr.ist:443
            zig.chainsafe.dev:443
            zig.karearl.com:443
            zig.linus.dev:443
            zig.mirror.mschae23.de:443
            zig.savalione.com:443
            zig.squirl.dev:443
            zig.tilok.dev:443
            zig.vortan.dev:443
            ziglang.freetls.fastly.net:443
            zigmirror.com:443
            zigmirror.hryx.net:443

      - name: checkout_release_workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This reusable workflow's own repo content (the reviewed mirror
          # list, see #31) — not the caller's, which is what a bare
          # checkout would default to, and not github.workflow_sha either
          # (that identifies the *caller's* workflow file, which won't
          # exist as a commit in this repo at all). job.workflow_repository
          # + job.workflow_sha are the ones documented for a reusable
          # workflow checking out its own source.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/zig-mirrors.txt
          sparse-checkout-cone-mode: false

      - name: require_tag_ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::release-rust must be triggered from a tag push (got ref_type='${REF_TYPE}', ref_name='${REF_NAME}'); gh release create --verify-tag needs an existing tag, so non-tag triggers would otherwise fail only after the full build matrix runs"
            exit 1
          fi

      - name: compose_build_matrix
        id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail

          # cargo needs both the registry index and the actual crate-file
          # host on every leg, plus the toolchain installer — verified
          # against real harden-runner audit logs, not guessed (see #23).
          common_endpoints="github.com:443 index.crates.io:443 static.crates.io:443 static.rust-lang.org:443"

          # zigbuild legs additionally need taiki-e/install-action fetching
          # the cargo-zigbuild binary from GitHub releases, and zig itself.
          # community-mirrors.txt is mutable, externally maintained content,
          # not something we've reviewed; trusting it directly would let an
          # upstream compromise silently authorize a new build-time egress
          # target with no review on our side (#31). Only trust a mirror
          # that's BOTH currently live upstream AND already reviewed into
          # .github/zig-mirrors.txt: a mirror going away upstream drops out
          # with no PR needed; a new one only becomes trusted once someone
          # reviews and commits it. Compare full base URLs, not just
          # hostnames — a path change on an already-approved host (e.g. a
          # hijacked /zig subpath) is exactly the kind of unreviewed change
          # this is meant to catch, and it would slip through a
          # hostname-only comparison.
          live_mirrors=$(curl -fsSL https://ziglang.org/download/community-mirrors.txt \
            | sed -E 's#/+$##' | sort -u)
          reviewed_mirrors=$(sed -E 's#/+$##' .github/zig-mirrors.txt | sort -u)
          approved_mirrors=$(comm -12 <(echo "$live_mirrors") <(echo "$reviewed_mirrors"))

          if [ -z "$approved_mirrors" ]; then
            echo "::error::no zig mirrors are both live upstream and reviewed in .github/zig-mirrors.txt — the reviewed list has likely gone stale, update it before retrying"
            exit 1
          fi

          # Pin one specific, reviewed mirror for setup_zig's `mirror:`
          # override rather than letting it pick at random from the live
          # list (which would bypass the review above entirely). Probe
          # candidates in random order and commit to the first that actually
          # responds for the exact tarball this run needs: when `mirror:` is
          # set, setup-zig does not retry or fall back to any other mirror
          # on failure (confirmed against its source), so pinning one we
          # haven't confirmed is reachable risks failing the whole leg with
          # no in-run recovery. Both zigbuild legs run on ubuntu-24.04
          # runners regardless of the cross-compile target, so there's only
          # ever one filename to check. Reviewed mirrors serve it flat, at
          # <base>/<file> — most do NOT mirror ziglang.org/download's own
          # <base>/<version>/<file> layout, confirmed by probing all of
          # them (9 of 16 404 with a version segment). HEAD, not a ranged
          # GET: one reviewed mirror (zigmirror.com) rejects HEAD with 405,
          # but a ranged GET fails on more (mirrors that ignore Range and
          # stream the whole ~55MB file, timing out) — HEAD has fewer
          # false negatives overall across the reviewed set.
          zig_tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          zig_mirror=""
          while IFS= read -r candidate; do
            if curl -fsSL --head --max-time 10 "${candidate}/${zig_tarball}" >/dev/null 2>&1; then
              zig_mirror="$candidate"
              break
            fi
          done <<<"$(printf '%s\n' "$approved_mirrors" | shuf)"

          if [ -z "$zig_mirror" ]; then
            echo "::error::none of the approved zig mirrors responded for ${zig_tarball} — check mirror availability or review .github/zig-mirrors.txt"
            exit 1
          fi

          zig_mirror_host=$(printf '%s' "$zig_mirror" | sed -E 's#^https://##; s#/.*$##')
          zigbuild_endpoints="${common_endpoints} release-assets.githubusercontent.com:443 ${zig_mirror_host}:443"

          if ! matrix=$(jq -c \
            --arg common "$common_endpoints" \
            --arg zigbuild_endpoints "$zigbuild_endpoints" \
            --arg zig_mirror "$zig_mirror" \
            '
            if type != "array" then
              error("targets must be a JSON array of strings")
            elif length == 0 then
              error("targets must contain at least one target")
            elif any(.[]; type != "string") then
              error("targets must contain only strings")
            elif length != (unique | length) then
              error("targets must not contain duplicate entries")
            else . end
            | [ .[] | . as $t |
              { target: $t } +
              ( { "x86_64-unknown-linux-musl":  { "runs-on": "ubuntu-24.04", "zigbuild": true,  "allowed-endpoints": $zigbuild_endpoints, "zig-mirror": $zig_mirror },
                  "aarch64-unknown-linux-musl": { "runs-on": "ubuntu-24.04", "zigbuild": true,  "allowed-endpoints": $zigbuild_endpoints, "zig-mirror": $zig_mirror },
                  "x86_64-apple-darwin":        { "runs-on": "macos-15",     "zigbuild": false, "allowed-endpoints": $common },
                  "aarch64-apple-darwin":       { "runs-on": "macos-15",     "zigbuild": false, "allowed-endpoints": $common }
                }[$t] // error("unsupported target: \($t)") )
            ]' <<<"$TARGETS"); then
            echo "::error::release-rust supports: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-apple-darwin, aarch64-apple-darwin"
            exit 1
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: ${{ matrix.allowed-endpoints }}

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: rust_toolchain
        # Explicit toolchain + cross-target install; hand-rolling rustup here
        # would just reimplement this action with less auditability.
        # dtolnay/rust-toolchain intentionally ships no tags — master/stable/
        # beta/nightly are branch aliases by design, so the pin below is the
        # tip of "master", not a stale reference. Both zizmor findings on
        # this line are suppressed in .github/zizmor.yml, not inline.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # Required: when this action is pinned by SHA the @ref no longer
          # names a toolchain, so it must be passed explicitly.
          toolchain: ${{ inputs.toolchain }}
          targets: ${{ matrix.target }}

      - name: setup_zig
        if: ${{ matrix.zigbuild }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
          # Pinned to the specific mirror the plan job already probed and
          # reviewed (#31) — without this, setup-zig fetches the live
          # community-mirrors.txt itself and picks at random, which neither
          # this workflow's review process nor its egress allowlist would
          # ever see.
          mirror: ${{ matrix.zig-mirror }}

      - name: install_cargo_zigbuild
        if: ${{ matrix.zigbuild }}
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          # Prebuilt binary, checksum-verified against install-action's
          # committed manifest. @version pin is mandatory — bare tool names
          # float to latest at runtime.
          tool: cargo-zigbuild@${{ env.ZIGBUILD_VERSION }}
          checksum: true

      - name: build (zigbuild)
        if: ${{ matrix.zigbuild }}
        env:
          BIN: ${{ inputs.bin }}
          TARGET: ${{ matrix.target }}
        run: cargo zigbuild --locked --release --target "$TARGET" --bin "$BIN"

      - name: build (native)
        if: ${{ !matrix.zigbuild }}
        env:
          BIN: ${{ inputs.bin }}
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET" --bin "$BIN"

      - name: package
        env:
          BIN: ${{ inputs.bin }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
          PACKAGE_FILES: ${{ inputs.package-files }}
        run: |
          set -euo pipefail
          # github.ref_name can contain "/" (e.g. component-scoped tags like
          # "cli/v1.2.3"). Sanitize before using it in the archive filename so
          # tar doesn't need intermediate directories under dist/ to exist.
          version="${VERSION//\//-}"
          pkg_dir="$(mktemp -d)/${BIN}"
          mkdir -p "${pkg_dir}" dist
          cp "target/${TARGET}/release/${BIN}" "${pkg_dir}/"
          for f in $PACKAGE_FILES; do
            [ -f "$f" ] || continue
            if [[ "$(basename "$f")" == "$BIN" ]]; then
              echo "::error::package file conflicts with binary: $f"
              exit 1
            fi
            cp -- "$f" "${pkg_dir}/"
          done
          tar czf "dist/${BIN}-${version}-${TARGET}.tar.gz" -C "${pkg_dir}" .

      - name: upload_archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  provenance:
    name: attest_and_publish
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # sigstore keyless signing for build provenance (SLSA L3)
      attestations: write # publish the provenance attestation to the repo
      contents: write # create the GitHub release and upload assets
      # Read-only; needed to enumerate this run's own artifacts so they can
      # be downloaded by immutable id rather than by (spoofable) name.
      # Matrix job outputs collapse to a single value, so
      # needs.build.outputs can't carry every target's artifact-id across.
      actions: read # list this run's artifacts to resolve their immutable ids
    outputs:
      release-url: ${{ steps.publish.outputs.url }}
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: collect_artifact_ids
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          # In a reusable workflow, GITHUB_RUN_ID is the *caller's* run, which
          # may contain artifacts from unrelated jobs (other steps in the same
          # run, or another concurrent call to this workflow). Only trust
          # artifacts whose name exactly matches one of this build's own
          # targets, and require exactly one per target, rather than every
          # artifact that happens to start with "dist-".
          mapfile -t targets < <(jq -r '[.[].target] | sort | .[]' <<<"$MATRIX")

          # --slurp folds paginated responses into one array; without it,
          # a second page would emit a separate JSON document and silently
          # break the join. Correct even though targets rarely exceed a page.
          artifacts=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            | jq -c '[.[].artifacts[]]')

          ids=()
          for target in "${targets[@]}"; do
            name="dist-${target}"
            matches=$(jq --arg n "$name" '[.[] | select(.name == $n)]' <<<"$artifacts")
            count=$(jq 'length' <<<"$matches")
            if [ "$count" -ne 1 ]; then
              echo "::error::expected exactly one artifact named '${name}' in this run, found ${count}"
              exit 1
            fi
            ids+=("$(jq -r '.[0].id' <<<"$matches")")
          done

          IFS=,
          echo "ids=${ids[*]}" >> "$GITHUB_OUTPUT"
          unset IFS

      - name: download_archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > checksums.txt

      - name: attest_build_provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          # Deliberately includes checksums.txt: the convenience index is
          # bound to the same trust chain as the artifacts it lists.
          subject-path: dist/*

      - name: release_note
        id: notes
        uses: purpleclay/release-note-action@9fa4adcdc68af9a0630f8d64fae6e38e31c259f7 # v0.2.0

      - name: publish_release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTE_FILE: ${{ steps.notes.outputs.release-note-path }}
        run: |
          set -euo pipefail
          # gh always exits 1 on failure, whether the release is genuinely
          # absent, or the check itself failed (auth, network, GitHub API
          # error). Only the exact "release not found" message confirms
          # absence; anything else is a real failure and must abort here.
          #
          # Immutable releases mean an existing release for this tag can
          # never be deleted or modified, complete or not — there is no
          # recovery path here but a new tag (see "Fixing a bad release" in
          # RELEASE.md). So existence is treated as done, not something to
          # replace: no delete, ever, on this path. The tag itself belongs
          # to the caller (verified to exist below via --verify-tag), so
          # this only ever concerned the release object, never the tag.
          if view_output=$(gh release view "$TAG" 2>&1 >/dev/null); then
            echo "release for '$TAG' already exists; nothing to publish"
            url=$(gh release view "$TAG" --json url --jq '.url')
          elif [ "$view_output" = "release not found" ]; then
            url=$(gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file "$NOTE_FILE" \
              --verify-tag)
          else
            echo "::error::could not confirm whether a release for '$TAG' already exists: $view_output"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
