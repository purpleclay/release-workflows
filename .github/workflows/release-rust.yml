name: release-rust
on:
  workflow_call:
    inputs:
      bin:
        description: Name of the binary to build and package
        type: string
        required: true
      targets:
        description: >-
          JSON array of Rust target triples, e.g.
          ["x86_64-unknown-linux-musl","aarch64-apple-darwin"]. Supported:
          x86_64-unknown-linux-musl, aarch64-unknown-linux-musl,
          x86_64-apple-darwin and aarch64-apple-darwin.
        type: string
        required: true
      toolchain:
        description: >-
          Rust toolchain to build with, e.g. stable or 1.89.0. A
          rust-toolchain.toml in the repository takes precedence.
        type: string
        required: false
        default: stable
      environment:
        description: >-
          GitHub environment the attest and publish jobs run under. GitHub
          creates a missing environment without protection, so add a
          required reviewer in each repo.
        type: string
        required: false
        default: release
      package-files:
        description: >-
          Space-separated list of extra files, relative to the repository
          root, bundled into each release archive alongside the binary.
          Missing files are skipped.
        type: string
        required: false
        default: LICENSE README.md
    outputs:
      release-url:
        description: URL of the published release
        value: ${{ jobs.provenance.outputs.release-url }}

permissions: {}

env:
  # Build-tool pins. A bump changes release security for every caller, so
  # review it like code. ZIG_VERSION uses the Codeberg manager in
  # .github/renovate.json, because GitHub's ziglang/zig mirror is stale.
  # renovate: depName=ziglang/zig
  ZIG_VERSION: "0.17.0"
  # renovate: datasource=github-tags depName=rust-cross/cargo-zigbuild versioning=semver
  ZIGBUILD_VERSION: "0.23.4"
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: "v1.54.1"
  # renovate: datasource=github-tags depName=rust-secure-code/cargo-auditable versioning=semver
  CARGO_AUDITABLE_VERSION: "0.7.7"

jobs:
  # Checks the requested targets against an allowlist and emits the build
  # matrix. A trust-root workflow never guesses how to build an unknown
  # target.
  plan:
    name: plan_build_matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          # Every host in .github/zig-mirrors.txt, so compose_build_matrix
          # can probe them. This step runs before checkout, so the list
          # can't be read from that file. Keep the two in sync by hand.
          allowed-endpoints: >
            github.com:443
            ziglang.org:443
            fs.liujiacai.net:443
            pkg.earth:443
            pkg.hexops.org:443
            zig-mirror.tsimnet.eu:443
            zig.bcr.ist:443
            zig.chainsafe.dev:443
            zig.karearl.com:443
            zig.linus.dev:443
            zig.mirror.mschae23.de:443
            zig.savalione.com:443
            zig.squirl.dev:443
            zig.tilok.dev:443
            zig.vortan.dev:443
            ziglang.freetls.fastly.net:443
            zigmirror.com:443
            zigmirror.hryx.net:443

      - name: checkout_release_workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This workflow's own repo, for the reviewed mirror list. A
          # bare checkout gets the caller's repo, and github.workflow_sha
          # names the caller's commit.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/zig-mirrors.txt
          sparse-checkout-cone-mode: false

      - name: require_tag_ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::release-rust must be triggered from a tag push (got ref_type='${REF_TYPE}', ref_name='${REF_NAME}'); gh release create --verify-tag needs an existing tag, so non-tag triggers would otherwise fail only after the full build matrix runs"
            exit 1
          fi

      - name: compose_build_matrix
        id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail

          # Hosts every build leg needs: crates.io, the Rust toolchain, and
          # the cargo-auditable and Syft downloads. Taken from harden-runner
          # audit logs (#23). api.github.com isn't needed here.
          common_endpoints="github.com:443 index.crates.io:443 static.crates.io:443 static.rust-lang.org:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443"

          # zigbuild legs also need a Zig mirror. community-mirrors.txt is
          # mutable and unreviewed, so trust only mirrors that are live and
          # listed in .github/zig-mirrors.txt (#31). Compare full base URLs,
          # not hostnames, so a hijacked path on an approved host fails.
          live_mirrors=$(curl -fsSL https://ziglang.org/download/community-mirrors.txt \
            | sed -E 's#/+$##' | sort -u)
          reviewed_mirrors=$(sed -E 's#/+$##' .github/zig-mirrors.txt | sort -u)
          approved_mirrors=$(comm -12 <(echo "$live_mirrors") <(echo "$reviewed_mirrors"))

          if [ -z "$approved_mirrors" ]; then
            echo "::error::no zig mirrors are both live upstream and reviewed in .github/zig-mirrors.txt — the reviewed list has likely gone stale, update it before retrying"
            exit 1
          fi

          # Pin one mirror for setup_zig, which doesn't retry or fall back.
          # Probe in random order and take the first that serves the tarball
          # at <base>/<file>. HEAD, not a ranged GET: some mirrors ignore
          # Range and stream the whole ~55MB file.
          zig_tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          zig_mirror=""
          while IFS= read -r candidate; do
            if curl -fsSL --head --max-time 10 "${candidate}/${zig_tarball}" >/dev/null 2>&1; then
              zig_mirror="$candidate"
              break
            fi
          done <<<"$(printf '%s\n' "$approved_mirrors" | shuf)"

          if [ -z "$zig_mirror" ]; then
            echo "::error::none of the approved zig mirrors responded for ${zig_tarball} — check mirror availability or review .github/zig-mirrors.txt"
            exit 1
          fi

          zig_mirror_host=$(printf '%s' "$zig_mirror" | sed -E 's#^https://##; s#/.*$##')
          zigbuild_endpoints="${common_endpoints} ${zig_mirror_host}:443"

          if ! matrix=$(jq -c \
            --arg common "$common_endpoints" \
            --arg zigbuild_endpoints "$zigbuild_endpoints" \
            --arg zig_mirror "$zig_mirror" \
            '
            if type != "array" then
              error("targets must be a JSON array of strings")
            elif length == 0 then
              error("targets must contain at least one target")
            elif any(.[]; type != "string") then
              error("targets must contain only strings")
            elif length != (unique | length) then
              error("targets must not contain duplicate entries")
            else . end
            | [ .[] | . as $t |
              { target: $t } +
              ( { "x86_64-unknown-linux-musl":  { "runs-on": "ubuntu-26.04", "zigbuild": true,  "allowed-endpoints": $zigbuild_endpoints, "zig-mirror": $zig_mirror },
                  "aarch64-unknown-linux-musl": { "runs-on": "ubuntu-26.04", "zigbuild": true,  "allowed-endpoints": $zigbuild_endpoints, "zig-mirror": $zig_mirror },
                  "x86_64-apple-darwin":        { "runs-on": "macos-26",     "zigbuild": false, "allowed-endpoints": $common },
                  "aarch64-apple-darwin":       { "runs-on": "macos-26",     "zigbuild": false, "allowed-endpoints": $common }
                }[$t] // error("unsupported target: \($t)") )
            ]' <<<"$TARGETS"); then
            echo "::error::release-rust supports: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-apple-darwin, aarch64-apple-darwin"
            exit 1
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
    # One output per target, written only by that target's leg. GitHub
    # merges distinct keys across matrix legs. artifact-id lets later jobs
    # download exactly what was uploaded, not whatever matches a name in the
    # caller's run. Keep in sync with plan's target map.
    outputs:
      artifact-id-x86_64-unknown-linux-musl: ${{ steps.report.outputs.artifact-id-x86_64-unknown-linux-musl }}
      artifact-id-aarch64-unknown-linux-musl: ${{ steps.report.outputs.artifact-id-aarch64-unknown-linux-musl }}
      artifact-id-x86_64-apple-darwin: ${{ steps.report.outputs.artifact-id-x86_64-apple-darwin }}
      artifact-id-aarch64-apple-darwin: ${{ steps.report.outputs.artifact-id-aarch64-apple-darwin }}
      build-inputs-x86_64-unknown-linux-musl: ${{ steps.record.outputs.build-inputs-x86_64-unknown-linux-musl }}
      build-inputs-aarch64-unknown-linux-musl: ${{ steps.record.outputs.build-inputs-aarch64-unknown-linux-musl }}
      build-inputs-x86_64-apple-darwin: ${{ steps.record.outputs.build-inputs-x86_64-apple-darwin }}
      build-inputs-aarch64-apple-darwin: ${{ steps.record.outputs.build-inputs-aarch64-apple-darwin }}
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: ${{ matrix.allowed-endpoints }}

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: rust_toolchain
        # dtolnay/rust-toolchain ships no tags, so this pins the tip of the
        # master branch. zizmor flags it as stale whenever master moves ahead,
        # until Renovate bumps the pin. Rustup by hand would be harder to
        # audit than this action.
        # zizmor: ignore[superfluous-actions]
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          # A SHA pin doesn't name a toolchain, so pass one explicitly.
          toolchain: ${{ inputs.toolchain }}
          targets: ${{ matrix.target }}

      # Recorded before any cargo command, so caller code (build.rs, proc
      # macros) can't change it. rustc runs in the checkout, so a
      # rust-toolchain.toml override shows up.
      - name: record_build_inputs
        id: record
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          facts=$(jq -cn \
            --arg image "$ImageOS" \
            --arg image_version "$ImageVersion" \
            --arg arch "$RUNNER_ARCH" \
            --arg rustc "$(rustc -Vv)" \
            '{runner: {image: $image, "image-version": $image_version, arch: $arch}, rustc: $rustc}')
          printf 'build-inputs-%s=%s\n' "$TARGET" "$facts" >> "$GITHUB_OUTPUT"

      - name: install_cargo_auditable
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          # Every leg: Syft reads the dependency data it embeds.
          tool: cargo-auditable@${{ env.CARGO_AUDITABLE_VERSION }}
          checksum: true

      - name: setup_zig
        if: ${{ matrix.zigbuild }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
          # The mirror plan probed (#31). Without it, setup-zig picks one at
          # random from the live list, outside review and the allowlist.
          mirror: ${{ matrix.zig-mirror }}

      - name: install_cargo_zigbuild
        if: ${{ matrix.zigbuild }}
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          # Checksum-verified prebuilt binary. Without @version it floats to
          # the latest release.
          tool: cargo-zigbuild@${{ env.ZIGBUILD_VERSION }}
          checksum: true

      - name: build (zigbuild)
        if: ${{ matrix.zigbuild }}
        env:
          BIN: ${{ inputs.bin }}
          TARGET: ${{ matrix.target }}
        # Order matters: `cargo auditable zigbuild` embeds dependency data,
        # `cargo zigbuild auditable` silently doesn't
        # (rust-secure-code/cargo-auditable#179).
        run: cargo auditable zigbuild --locked --release --target "$TARGET" --bin "$BIN"

      - name: build (native)
        if: ${{ !matrix.zigbuild }}
        env:
          BIN: ${{ inputs.bin }}
          TARGET: ${{ matrix.target }}
        run: cargo auditable build --locked --release --target "$TARGET" --bin "$BIN"

      - name: package
        id: package
        env:
          BIN: ${{ inputs.bin }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
          PACKAGE_FILES: ${{ inputs.package-files }}
        run: |
          set -euo pipefail
          # Tags like "cli/v1.2.3" contain "/", which can't go in a filename.
          version="${VERSION//\//-}"
          pkg_dir="$(mktemp -d)/${BIN}"
          mkdir -p "${pkg_dir}" dist
          cp "target/${TARGET}/release/${BIN}" "${pkg_dir}/"
          # Files are flattened into one directory, so fail on a basename
          # collision rather than silently overwrite. Indexed array, not
          # declare -A: macOS runners ship bash 3.2.
          seen_basenames=()
          for f in $PACKAGE_FILES; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            if [[ "$base" == "$BIN" ]]; then
              echo "::error::package file conflicts with binary: $f"
              exit 1
            fi
            for seen in "${seen_basenames[@]:-}"; do
              if [[ -n "$seen" && "$seen" == "$base" ]]; then
                echo "::error::package files collide on basename '${base}': $f"
                exit 1
              fi
            done
            seen_basenames+=("$base")
            cp -- "$f" "${pkg_dir}/"
          done
          asset="${BIN}-${version}-${TARGET}.tar.gz"
          tar czf "dist/${asset}" -C "${pkg_dir}" .
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      # Scans the binary (file:), not the source tree (path:), so only linked
      # dependencies appear. Uploads are off: the SBOM travels only in dist/.
      - name: generate_sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: target/${{ matrix.target }}/release/${{ inputs.bin }}
          format: spdx-json
          output-file: dist/${{ steps.package.outputs.asset }}.spdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false

      - name: patch_sbom
        env:
          BIN: ${{ inputs.bin }}
          OUTPUT_PATH: dist/${{ steps.package.outputs.asset }}.spdx.json
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Find the crate that owns $BIN: a [[bin]] name can differ from its
          # package name, and Syft drops cargo-auditable's root marker.
          crate_info=$(cargo metadata --no-deps --locked --format-version=1 \
            | jq -c --arg bin "$BIN" '
                [.packages[] | select(.targets[] | .kind[]? == "bin" and .name == $bin) | {name, version}]
                | if length != 1 then error("expected exactly one package owning bin target \($bin), found \(length)") else .[0] end')
          crate_name=$(jq -r '.name' <<<"$crate_info")
          crate_version=$(jq -r '.version' <<<"$crate_info")

          comment="Generated from the compiled binary (post-build) via Syft's cargo-auditable-binary-cataloger, not a Cargo.lock/source-tree scan."

          # Match name and version: a dependency can share the root crate's
          # name. Skip primaryPackagePurpose "FILE", the scanned file's own
          # entry, which shares the crate's name unless [[bin]] renames it.
          if ! jq \
            --arg crate "$crate_name" \
            --arg crate_version "$crate_version" \
            --arg version "$VERSION" \
            --arg comment "$comment" '
              def is_root: .name == $crate and .versionInfo == $crate_version and (.primaryPackagePurpose // "") != "FILE";
              ([.packages[] | select(is_root)] | length) as $count
              | if $count != 1 then
                  error("expected exactly one package named \($crate)@\($crate_version) in SBOM, found \($count)")
                else . end
              | .packages |= map(if is_root then .versionInfo = $version else . end)
              | .creationInfo.comment = $comment
            ' "$OUTPUT_PATH" > "${OUTPUT_PATH}.tmp"; then
            echo "::error::failed to post-process SBOM at $OUTPUT_PATH"
            exit 1
          fi
          mv "${OUTPUT_PATH}.tmp" "$OUTPUT_PATH"

      - name: upload_archive
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Prefixed with bin, so two calls in one caller run can't collide.
          name: dist-${{ inputs.bin }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

      # A caller job sharing this run could replace the artifact with
      # upload-artifact's overwrite: true. The replacement gets a new id, so
      # downloading by the id reported here fails closed.
      - name: report_artifact_id
        id: report
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "artifact-id-${TARGET}=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"

  # One attest call per target, because sbom-path takes a single SBOM. Kept
  # out of build so the environment's reviewer approves once, after every
  # build succeeds, not once per target before compiling.
  attest_sbom:
    name: attest_sbom / ${{ matrix.target }}
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # sigstore keyless signing for SBOM attestation (SLSA L3)
      attestations: write # publish the SBOM attestation to the repo
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443

      # No checkout: this job never reads repo files.

      - name: resolve_artifact_id
        id: artifact
        env:
          TARGET: ${{ matrix.target }}
          BUILD_OUTPUTS: ${{ toJSON(needs.build.outputs) }}
        run: |
          set -euo pipefail
          # Fail rather than pass an empty id: download-artifact would then
          # download every artifact in the run.
          id=$(jq -r --arg t "$TARGET" '
            .["artifact-id-" + $t] // ""
            | if . == "" then error("build reported no artifact id for \($t)") else . end' <<<"$BUILD_OUTPUTS")
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: download_archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          path: dist

      - name: locate_subject
        id: locate
        run: |
          set -euo pipefail
          # Glob and assert exactly one, rather than recomputing the
          # filename template a third time.
          mapfile -t archives < <(compgen -G "dist/*.tar.gz")
          mapfile -t sboms < <(compgen -G "dist/*.spdx.json")
          if [ "${#archives[@]}" -ne 1 ] || [ "${#sboms[@]}" -ne 1 ]; then
            echo "::error::expected exactly one archive and one .spdx.json in this leg's artifact, found ${#archives[@]} archive(s) and ${#sboms[@]} sbom(s)"
            exit 1
          fi
          echo "archive=${archives[0]}" >> "$GITHUB_OUTPUT"
          echo "sbom=${sboms[0]}" >> "$GITHUB_OUTPUT"

      - name: attest_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.locate.outputs.archive }}
          sbom-path: ${{ steps.locate.outputs.sbom }}

  provenance:
    name: attest_and_publish
    # Waits for every SBOM attestation. Releases are immutable, so one must
    # never publish without them.
    needs: [plan, build, attest_sbom]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # sigstore keyless signing for build provenance (SLSA L3)
      attestations: write # publish the provenance attestation to the repo
      contents: write # create the GitHub release and upload assets
    outputs:
      release-url: ${{ steps.publish.outputs.url }}
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: collect_artifact_ids
        id: artifacts
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          BUILD_OUTPUTS: ${{ toJSON(needs.build.outputs) }}
        run: |
          set -euo pipefail
          ids=$(jq -r --argjson outputs "$BUILD_OUTPUTS" '
            [ .[].target as $t
              | $outputs["artifact-id-" + $t] // ""
              | if . == "" then error("build reported no artifact id for \($t)") else . end
            ] | join(",")' <<<"$MATRIX")
          echo "ids=${ids}" >> "$GITHUB_OUTPUT"

      # Written outside dist/ so it isn't published or attested as an asset.
      - name: compose_build_inputs
        id: build_inputs
        env:
          INPUTS: ${{ toJSON(inputs) }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          BUILD_OUTPUTS: ${{ toJSON(needs.build.outputs) }}
        run: |
          set -euo pipefail
          path="${RUNNER_TEMP}/build-inputs.json"
          jq -n \
            --argjson inputs "$INPUTS" \
            --argjson matrix "$MATRIX" \
            --argjson outputs "$BUILD_OUTPUTS" \
            --arg cargo_auditable "$CARGO_AUDITABLE_VERSION" \
            --arg syft "$SYFT_VERSION" \
            --arg zig "$ZIG_VERSION" \
            --arg zigbuild "$ZIGBUILD_VERSION" '
            { inputs: $inputs,
              tools: { "cargo-auditable": $cargo_auditable, syft: $syft },
              targets: (reduce $matrix[] as $m ({};
                .[$m.target] = (
                  ($outputs["build-inputs-" + $m.target] // ""
                    | if . == "" then error("build reported no inputs for \($m.target)") else fromjson end)
                  + if $m.zigbuild
                    then { zig: { version: $zig, mirror: $m["zig-mirror"] }, "cargo-zigbuild": $zigbuild }
                    else {} end))) }' > "$path"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: download_archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > checksums.txt

      - name: attest_build_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # Every asset, including checksums.txt and the SBOMs.
          subject-path: dist/*

      - name: attest_build_inputs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          predicate-type: https://github.com/purpleclay/release-workflows/build-inputs/v1
          predicate-path: ${{ steps.build_inputs.outputs.path }}

      # Runs the documented verify commands against every asset before the
      # release exists, because an immutable release can't be fixed after.
      - name: verify_attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_WORKFLOW: ${{ job.workflow_repository }}/.github/workflows/release-rust.yml
          SIGNER_DIGEST: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          verify() {
            gh attestation verify "$1" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --signer-digest "$SIGNER_DIGEST" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              "${@:2}"
          }
          for asset in dist/*; do
            verify "$asset"
            verify "$asset" --predicate-type https://github.com/purpleclay/release-workflows/build-inputs/v1
          done
          for archive in dist/*.tar.gz; do
            verify "$archive" --predicate-type https://spdx.dev/Document
          done

      - name: release_note
        id: notes
        uses: purpleclay/release-note-action@173903da3997acebdb2c04f3de707c7c4c1a283e # v0.3.1

      - name: publish_release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTE_FILE: ${{ steps.notes.outputs.release-note-path }}
        run: |
          set -euo pipefail
          # gh exits 1 whether the release is missing or the lookup failed,
          # so only the exact "release not found" message means it's absent.
          # An existing release is immutable and is left alone; a bad one
          # needs a new tag (see "Fixing a bad release" in RELEASE.md).
          if view_output=$(gh release view "$TAG" 2>&1 >/dev/null); then
            echo "release for '$TAG' already exists; nothing to publish"
            url=$(gh release view "$TAG" --json url --jq '.url')
          elif [ "$view_output" = "release not found" ]; then
            url=$(gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file "$NOTE_FILE" \
              --verify-tag)
          else
            echo "::error::could not confirm whether a release for '$TAG' already exists: $view_output"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
