name: apko-lock
on:
  workflow_call:
    inputs:
      config:
        description: >-
          Path to the apko config whose lock file (apko.yaml ->
          apko.lock.json) is refreshed.
        type: string
        required: true

permissions: {}

env:
  # Same pin as release-container.yml, so a lock file is generated by the
  # apko that later reads it. Renovate bumps both files in one PR; update
  # both checksums from the release's checksums.txt.
  # renovate: datasource=github-releases depName=chainguard-dev/apko
  APKO_VERSION: "v1.4.18"
  APKO_SHA256: 80d3b39ada69f51c82fcd1e04719eda9d12d4333fd46d31d7d7c9c2d0cdcd0b9
  BRANCH: apko-lock

jobs:
  refresh:
    name: refresh_lock
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Runs share one branch and PR, so a manual run waits for a scheduled one.
    concurrency:
      group: apko-lock-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write # commit the lock file to the update branch
      pull-requests: write # open or update the PR
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            packages.wolfi.dev:443
            release-assets.githubusercontent.com:443

      - name: require_default_branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::apko-lock must run on ${DEFAULT_BRANCH} (got ${REF}), as its PR targets that branch"
            exit 1
          fi

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Wolfi-only rule release-container.yml enforces, so a lock
      # this workflow writes is one release-container will accept.
      - name: check_config
        id: config
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [ -f "$CONFIG" ] || fail "config '${CONFIG}' does not exist"
          wolfi=https://packages.wolfi.dev/os
          yq -o=json '.' "$CONFIG" | jq -e --arg w "$wolfi" '
            (.contents.repositories == [$w])
            and (.contents.keyring == [$w + "/wolfi-signing.rsa.pub"])
            and (has("include") | not)
            and (.contents | has("baseimage") | not)' >/dev/null \
            || fail "config may only list ${wolfi} as its repository and its signing key as the keyring, with no include or baseimage"
          echo "lock=${CONFIG%.*}.lock.json" >> "$GITHUB_OUTPUT"

      - name: install_apko
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo apko.tgz "https://github.com/chainguard-dev/apko/releases/download/${APKO_VERSION}/apko_${APKO_VERSION#v}_linux_amd64.tar.gz"
          printf '%s  apko.tgz\n' "$APKO_SHA256" | sha256sum -c -
          tar -xzf apko.tgz --strip-components=1 -C bin "apko_${APKO_VERSION#v}_linux_amd64/apko"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: lock
        id: lock
        env:
          CONFIG: ${{ inputs.config }}
          LOCK: ${{ steps.config.outputs.lock }}
          SIGNER_REPO: ${{ job.workflow_repository }}
          SIGNER_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/old.lock.json"
          if [ -f "$LOCK" ]; then cp "$LOCK" "$old"; else echo '{}' > "$old"; fi
          apko lock "$CONFIG" --output "$LOCK"
          if git diff --quiet -- "$LOCK" && git ls-files --error-unmatch -- "$LOCK" >/dev/null 2>&1; then
            echo "::notice::${LOCK} is current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # One row per package whose versions changed, across all archs.
          rows=$(jq -rn --slurpfile o "$old" --slurpfile n "$LOCK" '
            def versions: reduce (.contents.packages // [])[] as $p ({};
              .[$p.name] += [$p.version]) | map_values(unique | join(", "));
            ($o[0] | versions) as $a | ($n[0] | versions) as $b
            | ($a + $b) | keys[] | select($a[.] != $b[.])
            | "| `\(.)` | \($a[.] // "-") | \($b[.] // "-") |"')
          {
            echo "Refreshes \`${LOCK}\` from \`${CONFIG}\` with apko ${APKO_VERSION}."
            echo
            if [ -n "$rows" ]; then
              echo "| Package | From | To |"
              echo "| ------- | ---- | -- |"
              echo "$rows"
            else
              echo "No package versions changed; only checksums or URLs did."
            fi
            echo
            echo "Opened by the [apko-lock](https://github.com/${SIGNER_REPO}/blob/${SIGNER_SHA}/.github/workflows/apko-lock.yml) workflow."
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: open_pr
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK: ${{ steps.config.outputs.lock }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          blob=$(git hash-object "$LOCK")
          current=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${LOCK}?ref=${BRANCH}" --jq .sha 2>/dev/null || true)
          title="fix(deps): refresh apko lock file"
          if [ "$current" = "$blob" ]; then
            # Still open the PR below, so a rerun recovers a run
            # that committed but failed before finishing.
            echo "::notice::${BRANCH} already holds this lock file"
          else
            # Reset the branch onto the base, then commit through the API so
            # GitHub signs the commit and no git credentials touch the runner.
            head=$(git rev-parse HEAD)
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" -f sha="$head" -F force=true >/dev/null
            else
              gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="$head" >/dev/null
            fi
            base_blob=$(git rev-parse --verify --quiet "HEAD:${LOCK}" || true)
            message=$(printf '%s\n\nSigned-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' "$title")
            args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/${LOCK}"
              -f message="$message" -f branch="$BRANCH" -f content="$(base64 -w0 "$LOCK")")
            [ -z "$base_blob" ] || args+=(-f sha="$base_blob")
            gh api "${args[@]}" >/dev/null
          fi

          # GitHub holds pull_request runs on a PR opened with GITHUB_TOKEN
          # until a maintainer approves them, so CI waits for review.
          pr=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base "$BASE" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
